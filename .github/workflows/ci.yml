# Every action is pinned to the commit of a release, and not to a tag.
# A tag moves. This project asks for root when it runs, and it signs its
# releases with build provenance, so the gate that produces them is pinned
# too.
#
# dtolnay/rust-toolchain usually reads the toolchain from the name of the ref,
# as in `@stable`. A pinned commit has no such name, so the toolchain is
# named in `with`.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: check on ${{ matrix.os }}
    strategy:
      # One host that fails must not hide the state of the other two. The
      # exit test of this phase needs all three answers.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Clippy compiles the tests as well, so it reports what rustc reports.
      # RUSTFLAGS stays unset, so this step and the next share one build.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # No test opens a device, so this step is the only place that proves
      # the device layer of a host runs at all. It reads the list of drives
      # and writes nothing.
      #
      # It also proves that the list needs no privilege on Linux and on
      # macOS, where the runner is an ordinary user. It proves nothing of the
      # kind on Windows, where the runner is an Administrator, so that claim
      # is checked by hand on a standard account.
      - name: list the drives
        run: cargo run -p burnout -- list

  # The exit test of the partition table, FAT32 and exFAT. Each host builds
  # an image of the Windows layout, mounts it with its own mechanism, checks
  # partition 1 with its own FAT check tool and partition 2 with its own exFAT
  # check tool, and reads every file back through its own drivers. Partition
  # 2 holds a file past 4 GiB. Linux does it all again at 4096-byte sectors.
  # The job after this one proves that the three hosts built the same image,
  # to the byte.
  #
  # The example runs in release. It hashes each file on the way in and on the
  # way back, and then the whole image, and a debug build takes minutes to
  # hash 6 GiB.
  layout:
    name: layout on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # 6 GiB and 12,345 bytes: past 4 GiB, and its last cluster is not full.
      LARGE_FILE: "6442463289"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: make the sample tree
        run: cargo run -q --release -p burnout-layout --example layout_image -- tree sample

      # The first image goes before the second is made, so the runner never
      # holds two images of 6 GiB.
      - name: check on Linux at 512 and 4096-byte sectors
        if: runner.os == 'Linux'
        run: |
          if ! command -v fsck.fat || ! command -v fsck.exfat; then
            sudo apt-get update && sudo apt-get install -y dosfstools exfatprogs
          fi
          # The kernel of the runner finds no exFAT driver until the extra
          # modules of that kernel are in.
          if ! sudo modprobe exfat; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe exfat
          fi
          cargo run -q --release -p burnout-layout --example layout_image -- image sample layout.img boot.sha256 --install-manifest install.sha256 --large-file "$LARGE_FILE" > digest.txt
          scripts/check-layout.sh layout.img boot.sha256 install.sha256 512
          rm layout.img
          cargo run -q --release -p burnout-layout --example layout_image -- image sample layout4k.img boot4k.sha256 --install-manifest install4k.sha256 --large-file "$LARGE_FILE" --sector-size 4096
          scripts/check-layout.sh layout4k.img boot4k.sha256 install4k.sha256 4096
          rm layout4k.img

      - name: check on macOS
        if: runner.os == 'macOS'
        run: |
          cargo run -q --release -p burnout-layout --example layout_image -- image sample layout.img boot.sha256 --install-manifest install.sha256 --large-file "$LARGE_FILE" > digest.txt
          scripts/check-layout.sh layout.img boot.sha256 install.sha256 512

      # Windows mounts a VHD, which is the image with a footer after it. The
      # digest is of the image without the footer, as on the other hosts.
      - name: make the VHD on Windows
        if: runner.os == 'Windows'
        run: cargo run -q --release -p burnout-layout --example layout_image -- image sample layout.vhd boot.sha256 --install-manifest install.sha256 --large-file "$LARGE_FILE" --vhd > digest.txt
      - name: check on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-layout.ps1 layout.vhd boot.sha256 install.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layout-digest-${{ runner.os }}
          path: digest.txt

  same-image:
    name: the same image on each host
    needs: layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: layout-digest-*
          path: digests
      - name: compare the digests
        run: |
          grep -H . digests/*/digest.txt
          test "$(ls digests | wc -l)" = 3
          test "$(cat digests/*/digest.txt | sort -u | wc -l)" = 1

  # The exit test of the reader of an ISO. Each host makes ISOs of the
  # sample tree with its own tool, and Burnout reads each one back and
  # compares it with the tree, byte for byte. The two scripts name the tools
  # and the forms. Linux adds a file past 4 GiB, which ISO 9660 keeps in
  # more than one extent, so the example runs in release to hash it.
  iso:
    name: iso on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: make the sample tree and the reader
        run: |
          cargo run -q --release -p burnout-layout --example layout_image -- tree sample
          cargo build -q --release -p burnout-iso --example iso_tree
      - name: check on Linux and macOS
        if: runner.os != 'Windows'
        run: |
          if [ "$(uname -s)" = Linux ] && ! command -v xorriso; then
            sudo apt-get update && sudo apt-get install -y xorriso
          fi
          scripts/check-iso.sh sample target/release/examples/iso_tree
      - name: check on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-iso.ps1 sample target/release/examples/iso_tree.exe

  # The exit test of Windows mode, against an image file. Each host makes a
  # Windows ISO of the sample tree with its own tool, and windows_image writes
  # the drive of Windows mode from it with the code of the product. The host
  # then mounts the image with its own mechanism, checks both volumes with its
  # own tools, and reads each file back against the manifests, autounattend.xml
  # with them. The install image is random bytes, and the manifests hold the
  # digests that went in.
  windows-mode:
    name: windows mode on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # 64 MiB and 7 bytes, so the last cluster of the image is not full.
      INSTALL_BYTES: "67108871"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: make the Windows tree and the writer
        run: |
          cargo run -q --release -p burnout-layout --example layout_image -- tree sample
          head -c "$INSTALL_BYTES" /dev/urandom > sample/sources/install.wim
          cargo build -q --release -p burnout-layout --example windows_image

      - name: check on Linux at 512 and 4096-byte sectors
        if: runner.os == 'Linux'
        run: |
          if ! command -v fsck.fat || ! command -v fsck.exfat || ! command -v xorriso; then
            sudo apt-get update && sudo apt-get install -y dosfstools exfatprogs xorriso
          fi
          if ! sudo modprobe exfat; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe exfat
          fi
          xorriso -as mkisofs -quiet -iso-level 3 -R -J -V SAMPLE -o windows.iso sample
          for sector in 512 4096; do
            target/release/examples/windows_image windows.iso windows.img --sector-size "$sector" \
              --skip-hardware-checks --no-microsoft-account \
              --boot-manifest boot.sha256 --install-manifest install.sha256
            scripts/check-layout.sh windows.img boot.sha256 install.sha256 "$sector"
            rm windows.img
          done

      - name: check on macOS
        if: runner.os == 'macOS'
        run: |
          hdiutil makehybrid -quiet -o windows.iso sample -udf -udf-version 1.02 -iso -joliet \
            -default-volume-name SAMPLE
          target/release/examples/windows_image windows.iso windows.img \
            --skip-hardware-checks --no-microsoft-account \
            --boot-manifest boot.sha256 --install-manifest install.sha256
          scripts/check-layout.sh windows.img boot.sha256 install.sha256 512

      - name: make the VHD on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/make-iso.ps1 sample windows.iso 7 0x102
          target/release/examples/windows_image.exe windows.iso windows.vhd --vhd `
            --skip-hardware-checks --no-microsoft-account `
            --boot-manifest boot.sha256 --install-manifest install.sha256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: check on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-layout.ps1 windows.vhd boot.sha256 install.sha256

  # A shim that belongs to one host is compiled only on that host, so a break
  # in it waits for that job. `cargo check` does not link, so this catches the
  # break from Linux in about a minute.
  other-targets:
    name: check the other hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check -p burnout --target x86_64-pc-windows-msvc
      - run: cargo check -p burnout --target aarch64-apple-darwin
