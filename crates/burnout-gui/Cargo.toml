[package]
name = "burnout-gui"
description = "A program with windows that writes a bootable USB drive through burnout."
version.workspace = true
edition.workspace = true
# Slint 1.18 needs Rust 1.92. The other crates keep 1.77.
rust-version = "1.92"
license.workspace = true
repository.workspace = true
authors.workspace = true
# The release plumbing for this package is not there yet.
publish = false

[dependencies]
rfd = "0.18"
serde_json = "1"
slint = "1.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
