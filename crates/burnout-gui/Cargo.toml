[package]
name = "burnout-gui"
description = "A program with windows that writes a bootable USB drive through burnout."
version.workspace = true
edition.workspace = true
# Slint 1.18 needs Rust 1.92. The other crates keep 1.77.
rust-version = "1.92"
license.workspace = true
repository.workspace = true
authors.workspace = true
# The release plumbing for this package is not there yet.
publish = false

[dependencies]
serde_json = "1"
slint = "1.18"

[build-dependencies]
slint-build = "1.18"
