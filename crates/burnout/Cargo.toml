[package]
name = "burnout"
description = "Writes a bootable USB drive from the command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
burnout-core = { path = "../burnout-core" }
clap = { version = "4", features = ["derive"] }

# The bindings of one host never reach the other two. Each one is raw, so the
# shim that uses it stays thin and the decisions stay in a pure module that
# every host compiles.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
io-kit-sys = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
] }

[[bin]]
name = "burnout"
path = "src/main.rs"
