[package]
name = "burnout"
description = "Writes a bootable USB drive from the command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["usb", "bootable", "iso", "windows", "installer"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
burnout-core.workspace = true
burnout-iso.workspace = true
burnout-layout.workspace = true
clap = { version = "4", features = ["derive"] }

# umount2, geteuid and O_EXCL have no equivalent in the standard library.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The bindings of one host never reach the other two. Each one is raw, so the
# shim that uses it stays thin and the decisions stay in a pure module that
# every host compiles.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
io-kit-sys = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
] }

[[bin]]
name = "burnout"
path = "src/main.rs"
